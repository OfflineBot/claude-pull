<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Usage · Stats</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <span class="brand">󰧑 Claude usage</span>
    <a href="/">Dashboard</a>
    <a href="/graphs.html">Graphs</a>
    <a href="/raw.html">Raw</a>
    <a href="/stats.html">Stats</a>
  </nav>

  <main>
    <div class="row-head"><h1>Stats</h1></div>

    <section class="stat-grid" id="grid">
      <div class="stat"><div class="stat-val" id="count">—</div><div class="stat-label">samples</div></div>
      <div class="stat"><div class="stat-val" id="since">—</div><div class="stat-label">collecting since</div></div>
      <div class="stat"><div class="stat-val" id="span">—</div><div class="stat-label">time span</div></div>
      <div class="stat"><div class="stat-val" id="peakSession">—</div><div class="stat-label">peak session</div></div>
      <div class="stat"><div class="stat-val" id="avgSession">—</div><div class="stat-label">avg session</div></div>
      <div class="stat"><div class="stat-val" id="peakWeek">—</div><div class="stat-label">peak week</div></div>
      <div class="stat"><div class="stat-val" id="avgWeek">—</div><div class="stat-label">avg week</div></div>
      <div class="stat"><div class="stat-val" id="interval">—</div><div class="stat-label">poll interval</div></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/stats.js"></script>
</body>
</html>
