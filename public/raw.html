<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Usage · Raw</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <span class="brand">󰧑 Claude usage</span>
    <a href="/">Dashboard</a>
    <a href="/graphs.html">Graphs</a>
    <a href="/raw.html">Raw</a>
    <a href="/stats.html">Stats</a>
  </nav>

  <main>
    <div class="row-head">
      <h1>Raw data</h1>
      <div class="exports">
        <a class="btn" href="/api/export.csv">⭳ CSV</a>
        <a class="btn" href="/api/export.json">⭳ JSON</a>
      </div>
    </div>

    <div class="panel">
      <table class="data">
        <thead>
          <tr><th>#</th><th>Time</th><th>Session</th><th>Week</th><th>Opus</th><th>Sonnet</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager">
        <button id="prev">← newer</button>
        <span id="pageInfo" class="muted"></span>
        <button id="next">older →</button>
      </div>
    </div>
  </main>

  <script src="/common.js"></script>
  <script src="/raw.js"></script>
</body>
</html>
