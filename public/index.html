<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Usage · Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <nav class="nav">
    <span class="brand">󰧑 Claude usage</span>
    <a href="/">Dashboard</a>
    <a href="/graphs.html">Graphs</a>
    <a href="/raw.html">Raw</a>
    <a href="/stats.html">Stats</a>
    <button id="refresh" title="Fetch now">↻</button>
  </nav>

  <main>
    <div class="row-head">
      <h1>Dashboard</h1>
      <span class="muted" id="updated">—</span>
    </div>

    <div id="error" class="error" hidden></div>

    <section class="cards">
      <div class="card">
        <div class="label">Session <span class="sub">5h window</span></div>
        <div class="pct" id="sessionPct">—</div>
        <div class="bar"><span id="sessionBar"></span></div>
        <div class="resets muted" id="sessionResets"></div>
      </div>
      <div class="card">
        <div class="label">Week <span class="sub">7d window</span></div>
        <div class="pct" id="weekPct">—</div>
        <div class="bar"><span id="weekBar"></span></div>
        <div class="resets muted" id="weekResets"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span>Last 7 days</span>
        <a class="link" href="/graphs.html">more graphs →</a>
      </div>
      <canvas id="chart" height="240"></canvas>
      <div class="legend">
        <span class="dot session"></span>Session
        <span class="dot week"></span>Week
      </div>
    </section>

    <footer>polls every <span id="interval">5</span> min · stored in SQLite</footer>
  </main>

  <script src="/common.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
