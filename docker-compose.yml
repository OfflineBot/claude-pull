services:
  claude-collection:
    build: .
    container_name: claude-collection
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      POLL_INTERVAL: "300"
      # On a remote host (Coolify) there is no Claude Code to keep the
      # credentials file fresh, so provide the OAuth access token directly.
      # Set CLAUDE_TOKEN in Coolify → Environment Variables.
      CLAUDE_TOKEN: "${CLAUDE_TOKEN:-}"
      CLAUDE_CREDENTIALS: "/credentials/.credentials.json"
    volumes:
      # named volume -> the SQLite DB survives redeploys (Coolify keeps it)
      - claude-data:/data
      # Expose the host's Claude credentials DIRECTORY (not the single file!)
      # so the always-refreshed OAuth token from Claude Code is visible on
      # every poll. Docker pins file-bind inodes at mount time, so a single-
      # file mount would freeze the token at deploy and start handing back
      # 401 after ~30 min — exactly the symptom we just hit. A directory
      # bind reads the current .credentials.json on every open().
      # If Claude Code lives in a different home, edit the host path here.
      - /home/offlinebot/.claude:/credentials:ro

volumes:
  claude-data:
